name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_install_e2e:
        description: Run privileged install/uninstall e2e when configured
        required: false
        default: false
        type: boolean
      easytier_version:
        description: EasyTier core version for privileged install e2e
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (static musl)
          - { target: x86_64-unknown-linux-musl,       os: linux,   arch: x86_64,     runner: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl,      os: linux,   arch: aarch64,    runner: ubuntu-latest }
          - { target: riscv64gc-unknown-linux-musl,    os: linux,   arch: riscv64,    runner: ubuntu-latest }
          - { target: loongarch64-unknown-linux-musl,  os: linux,   arch: loongarch64,runner: ubuntu-latest }
          - { target: armv7-unknown-linux-musleabihf,  os: linux,   arch: armv7hf,    runner: ubuntu-latest }
          - { target: armv7-unknown-linux-musleabi,    os: linux,   arch: armv7,      runner: ubuntu-latest }
          - { target: arm-unknown-linux-musleabihf,    os: linux,   arch: armhf,      runner: ubuntu-latest }
          - { target: arm-unknown-linux-musleabi,      os: linux,   arch: arm,        runner: ubuntu-latest }
          - { target: mips-unknown-linux-musl,         os: linux,   arch: mips,       runner: ubuntu-latest }
          - { target: mipsel-unknown-linux-musl,       os: linux,   arch: mipsel,     runner: ubuntu-latest }

          # macOS
          - { target: x86_64-apple-darwin,             os: macos,   arch: x86_64,     runner: macos-latest }
          - { target: aarch64-apple-darwin,            os: macos,   arch: aarch64,    runner: macos-latest }

          # Windows
          - { target: x86_64-pc-windows-msvc,          os: windows, arch: x86_64,     runner: windows-latest }
          - { target: i686-pc-windows-msvc,            os: windows, arch: i686,       runner: windows-latest }
          - { target: aarch64-pc-windows-msvc,         os: windows, arch: arm64,      runner: windows-11-arm }

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ !contains(matrix.target, 'mips') && matrix.target || '' }}
          components: ${{ contains(matrix.target, 'mips') && 'rust-src' || '' }}

      - name: Install zig
        if: matrix.os == 'linux' && !contains(matrix.target, 'mips')
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.os == 'linux' && !contains(matrix.target, 'mips')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install musl-cross (MIPS)
        if: contains(matrix.target, 'mips')
        run: |
          MUSL_TARGET="${{ matrix.target }}sf"
          mkdir -p ./musl_gcc
          wget -q "https://github.com/cross-tools/musl-cross/releases/download/20250520/${MUSL_TARGET}.tar.xz" -P ./musl_gcc/
          tar -xf "./musl_gcc/${MUSL_TARGET}.tar.xz" -C ./musl_gcc/
          chmod -R a+rwx ./musl_gcc
          cd "./musl_gcc/${MUSL_TARGET}/lib/gcc/${MUSL_TARGET}/15.1.0"
          cp libgcc_eh.a libunwind.a
          ar x libgcc.a _ctzsi2.o _clz.o _bswapsi2.o
          ar rcs libctz.a _ctzsi2.o _clz.o _bswapsi2.o
          echo "$PWD/../../../../bin" >> "$GITHUB_PATH"

      - name: Build (Linux, non-MIPS)
        if: matrix.os == 'linux' && !contains(matrix.target, 'mips')
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Build (MIPS)
        if: contains(matrix.target, 'mips')
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo build -Z build-std=std,panic_abort --release --target ${{ matrix.target }}

      - name: Build (macOS / Windows)
        if: matrix.os != 'linux'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/easytier-pro-installer"
          dst="easytier-pro-installer-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            cp "${src}.exe" "${dst}.exe"
          else
            cp "$src" "$dst"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: easytier-pro-installer-${{ matrix.os }}-${{ matrix.arch }}
          path: easytier-pro-installer-${{ matrix.os }}-${{ matrix.arch }}*

  artifact-smoke:
    name: Artifact Smoke ${{ matrix.os }}-${{ matrix.arch }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: x86_64,     runner: ubuntu-latest,   ext: '' }
          - { os: linux,   arch: aarch64,    runner: ubuntu-latest,   ext: '' }
          - { os: linux,   arch: riscv64,    runner: ubuntu-latest,   ext: '' }
          - { os: linux,   arch: loongarch64,runner: ubuntu-latest,   ext: '' }
          - { os: linux,   arch: armv7hf,    runner: ubuntu-latest,   ext: '' }
          - { os: linux,   arch: armv7,      runner: ubuntu-latest,   ext: '' }
          - { os: linux,   arch: armhf,      runner: ubuntu-latest,   ext: '' }
          - { os: linux,   arch: arm,        runner: ubuntu-latest,   ext: '' }
          - { os: linux,   arch: mips,       runner: ubuntu-latest,   ext: '' }
          - { os: linux,   arch: mipsel,     runner: ubuntu-latest,   ext: '' }
          - { os: macos,   arch: x86_64,     runner: macos-latest,    ext: '' }
          - { os: macos,   arch: aarch64,    runner: macos-latest,    ext: '' }
          - { os: windows, arch: x86_64,     runner: windows-latest,  ext: '.exe' }
          - { os: windows, arch: i686,       runner: windows-latest,  ext: '.exe' }
          - { os: windows, arch: arm64,      runner: windows-11-arm,  ext: '.exe' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: easytier-pro-installer-${{ matrix.os }}-${{ matrix.arch }}

      - name: Check artifact
        shell: bash
        run: |
          file="easytier-pro-installer-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          test -f "$file"
          test -s "$file"
          if [ "${{ matrix.os }}" != "windows" ]; then
            chmod +x "$file"
          fi

  release:
    name: Create Release
    needs: [build, artifact-smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  readme-install-smoke:
    name: README Install Smoke ${{ matrix.name }}
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   runner: ubuntu-latest,    os: linux }
          - { name: linux-aarch64,  runner: ubuntu-24.04-arm, os: linux }
          - { name: macos-x86_64,   runner: macos-13,         os: macos }
          - { name: macos-aarch64,  runner: macos-14,         os: macos }
          - { name: windows-x86_64, runner: windows-latest,   os: windows }
          - { name: windows-arm64,  runner: windows-11-arm,   os: windows }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Run README install script smoke (Linux/macOS)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          EASYTIER_INSTALLER_SOURCE=github INSTALL_DIR="$RUNNER_TEMP/easytier-pro-installer" bash ./install.sh --help

      - name: Run README install script smoke (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $env:EASYTIER_INSTALLER_SOURCE = 'github'
          ./install.ps1 -InstallDir "$env:RUNNER_TEMP\easytier-pro-installer" -InstallerArgs '--help'

  live-install-e2e:
    name: Live Install E2E ${{ matrix.name }}
    needs: readme-install-smoke
    if: startsWith(github.ref, 'refs/tags/v') && (vars.RUN_RELEASE_INSTALL_E2E == 'true' || inputs.run_install_e2e)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   runner: ubuntu-latest,    os: linux }
          - { name: linux-aarch64,  runner: ubuntu-24.04-arm, os: linux }
          - { name: macos-x86_64,   runner: macos-13,         os: macos }
          - { name: macos-aarch64,  runner: macos-14,         os: macos }
          - { name: windows-x86_64, runner: windows-latest,   os: windows }
          - { name: windows-arm64,  runner: windows-11-arm,   os: windows }
    runs-on: ${{ matrix.runner }}
    env:
      E2E_BOOTSTRAP_TOKEN: ${{ secrets.E2E_BOOTSTRAP_TOKEN }}
      E2E_CONFIG_SERVER: ${{ vars.E2E_CONFIG_SERVER }}
      E2E_EASYTIER_VERSION: ${{ inputs.easytier_version || vars.E2E_EASYTIER_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Check e2e configuration
        id: e2e_config
        shell: bash
        run: |
          if [ -z "$E2E_BOOTSTRAP_TOKEN" ] || [ -z "$E2E_CONFIG_SERVER" ] || [ -z "$E2E_EASYTIER_VERSION" ]; then
            echo "Privileged install e2e skipped: configure E2E_BOOTSTRAP_TOKEN, E2E_CONFIG_SERVER, and E2E_EASYTIER_VERSION."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$E2E_BOOTSTRAP_TOKEN"
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Download installer (Linux/macOS)
        if: steps.e2e_config.outputs.enabled == 'true' && matrix.os != 'windows'
        shell: bash
        run: |
          EASYTIER_INSTALLER_SOURCE=github INSTALL_DIR="$RUNNER_TEMP/easytier-pro-installer" bash ./install.sh --help

      - name: Install, status, and uninstall service (Linux/macOS)
        if: steps.e2e_config.outputs.enabled == 'true' && matrix.os != 'windows'
        shell: bash
        run: |
          installer="$RUNNER_TEMP/easytier-pro-installer/easytier-pro-installer"
          install_dir="$RUNNER_TEMP/easytier-live-e2e"
          cleanup() {
            printf '{"install_dir":"%s","purge":true}' "$install_dir" | sudo -E "$installer" desktop uninstall --json || true
          }
          trap cleanup EXIT
          printf '{"bootstrap_token":"%s","install_dir":"%s","config_server":"%s","version":"%s"}' \
            "$E2E_BOOTSTRAP_TOKEN" "$install_dir" "$E2E_CONFIG_SERVER" "$E2E_EASYTIER_VERSION" \
            | sudo -E "$installer" desktop install --json
          printf '{"bootstrap_token":"%s","install_dir":"%s","config_server":"%s","version":"%s"}' \
            "$E2E_BOOTSTRAP_TOKEN" "$install_dir" "$E2E_CONFIG_SERVER" "$E2E_EASYTIER_VERSION" \
            | "$installer" desktop status --json

      - name: Download installer (Windows)
        if: steps.e2e_config.outputs.enabled == 'true' && matrix.os == 'windows'
        shell: pwsh
        run: |
          $env:EASYTIER_INSTALLER_SOURCE = 'github'
          ./install.ps1 -InstallDir "$env:RUNNER_TEMP\easytier-pro-installer" -InstallerArgs '--help'

      - name: Install, status, and uninstall service (Windows)
        if: steps.e2e_config.outputs.enabled == 'true' && matrix.os == 'windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'easytier-pro-installer\easytier-pro-installer.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'easytier-live-e2e'
          $installRequest = @{
            bootstrap_token = $env:E2E_BOOTSTRAP_TOKEN
            install_dir = $installDir
            config_server = $env:E2E_CONFIG_SERVER
            version = $env:E2E_EASYTIER_VERSION
          } | ConvertTo-Json -Compress
          $statusRequest = @{
            bootstrap_token = $env:E2E_BOOTSTRAP_TOKEN
            install_dir = $installDir
            config_server = $env:E2E_CONFIG_SERVER
            version = $env:E2E_EASYTIER_VERSION
          } | ConvertTo-Json -Compress
          $uninstallRequest = @{
            install_dir = $installDir
            purge = $true
          } | ConvertTo-Json -Compress
          try {
            $installRequest | & $installer desktop install --json
            $statusRequest | & $installer desktop status --json
          } finally {
            $uninstallRequest | & $installer desktop uninstall --json
          }
